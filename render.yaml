services:
  - type: web
    name: ccw-kimpscope
    env: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from backend.store import collection, index_metadata; collection('items').count() == 0 and index_metadata()" && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CHAT_MODEL
        value: gpt-4.1-mini
      - key: EMBED_MODEL
        value: text-embedding-3-small
      - key: OPENAI_BASE_URL
        value: https://gms.ssafy.io/gmsapi/api.openai.com/v1/
      - key: OPENAI_API_KEY
        sync: false
