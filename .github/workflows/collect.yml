# 15분마다 빗썸 공지와 거래소 입출금·경보 상태를 수집해 Neon(PostgreSQL)에 기록한다.
# 무료 Render 웹 서비스는 요청이 없으면 잠들고, 그동안 내부 수집 스레드도 멈춘다. 이 작업이 그 공백을 메운다.
# 공개 저장소라 GitHub Actions 실행 시간은 무료다. 예약 실행은 GitHub 부하에 따라 몇 분 늦어질 수 있다.
# 필요한 저장소 Secret: DATABASE_URL (Render 웹 서비스와 같은 값)
name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cron.txt
      - run: pip install -r requirements-cron.txt
      - name: 수집 1회 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret이 없습니다"; exit 1; fi
          python -m scripts.cron_collect
